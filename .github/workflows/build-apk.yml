name: Build Weeqaya APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q Weeqaya_Supabase_v4_Core.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Copy APK
        run: |
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk ./weeqaya-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weeqaya-debug-apk
          path: weeqaya-debug.apk
