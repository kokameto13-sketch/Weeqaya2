name: Build Weeqaya APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "===== REPOSITORY FILES ====="
          ls -la

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          echo "===== ZIP FILE ====="
          ls -lh Weeqaya_Supabase_v4.1_Core_FIXED.zip

          unzip -q Weeqaya_Supabase_v4.1_Core_FIXED.zip -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle.kts -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        run: |
          cd "$PROJECT_DIR"

          echo "===== PROJECT DIRECTORY ====="
          pwd

          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== APP DIRECTORY ====="
          ls -la app

          echo "===== JAVA VERSION ====="
          java -version

          echo "===== GRADLE VERSION ====="
          gradle --version

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "===== STARTING BUILD ====="

          gradle :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain

      - name: Find APK
        if: always()
        run: |
          echo "===== APK SEARCH ====="

          find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weeqaya-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
