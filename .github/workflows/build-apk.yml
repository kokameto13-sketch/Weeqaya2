name: Build Weeqaya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          echo "===== REPOSITORY FILES ====="
          ls -lah
          echo "===== ZIP FILE ====="
          ls -lh Weeqaya_Supabase_v4_Core.zip

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q Weeqaya_Supabase_v4_Core.zip -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle.kts -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Java and Gradle
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

      - name: Verify Android project
        run: |
          cd "$PROJECT_DIR"

          echo "===== PROJECT ROOT ====="
          pwd
          ls -lah

          echo "===== APP DIRECTORY ====="
          ls -lah app

          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \
            -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \
            -print

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "===== STARTING BUILD ====="

          set +
